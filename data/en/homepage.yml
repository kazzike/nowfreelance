hero:
  title: "Scale your business, not the chaos."
  description: "Process Optimization Consulting: We detect areas for improvement in your operations, design custom solutions, and implement them with smart tools (including AI when it adds real value). Go from self-employed to strategic leader, saving up to 20h/week on inefficiencies, all so simple you can run it from your phone."
  cta_text: "Schedule my Free Clarity Session"
  cta_link: "/contact"

pain_points:
  title: "If your business grows, why do you feel more trapped?"
  subtitle: "If you identify with the following symptoms, see how our consulting identifies and resolves areas for improvement:"
  items:
    - icon: "folder-open"
      title: "Fragmented Information"
      description: "Data scattered across Excel, Word, and other platforms. → We diagnose failed connections and centralize everything into a unified system."
    - icon: "user-cog"
      title: "The business depends 100% on you"
      description: "Non-delegable processes. → We detect gaps in documentation and standardize flows for team autonomy."
    - icon: "alert-triangle"
      title: "Growth scares you"
      description: "More clients = more mess. → We identify bottlenecks and optimize processes to scale without wasting time."
    - icon: "plane"
      title: "Impossible Vacations"
      description: "Everything stops without you. → We analyze dependencies and create alerts/automations for remote monitoring."
    - icon: "trending-down"
      title: "Missed Opportunities"
      description: "Cold leads or dissatisfied clients. → We analyze where opportunities are lost and apply strategies to convert them into real sales."
    - icon: "git-merge"
      title: "It's not lack of effort"
      description: " → it's lack of expert diagnosis. We detect and fix it."

process:
  title: "Your modernization plan in 3 steps"
  subtitle: "We don't interrupt your business. We empower it smoothly and without technical jargon."
  steps:
    - title: "1. Diagnosis and Roadmap"
      description: "In our 'Clarity Session', we map your business, not your apps. We understand your ambitions and detect the bottlenecks that truly hold back your growth. We deliver a clear plan."
    - title: "2. Modernization and Implementation"
      description: "We build your centralized system. We migrate your old processes to a secure, integrated digital ecosystem accessible from any device."
    - title: "3. Training and Launch"
      description: "The goal is your freedom. We train you and your team to master the new system. We don't create dependency, we create autonomy."

case_study:
  title: "Success Story: From being trapped in Excel to leading a growing business"
  challenge_title: "The Challenge"
  challenge: "A client with a clear vision to expand their business to new regions, but drowned in the chaos of managing credits and sales with local Excel and Word files. Growth was impossible."
  mission_title: "Our Mission"
  mission: "The problem wasn't Excel, it was the mindset. The first step was strategic: demonstrating that to scale, you must trust modern systems."
  transformation_title: "The Transformation"
  transformation: "We created a single digital ecosystem that centralized the entire operation. The entire team, regardless of location, started working on the same information in real time."
  result_title: "The Result"
  result: "Today, they manage a multi-office business from a single place, have eliminated data loss, and have recovered the time and peace of mind to focus on what truly matters: continuing to grow."
  cta_text: "See how we can do this for you"
  cta_link: "/contact"

contact:
  subtitle: "There's no commitment. Just an honest conversation about whether we can help you scale your business."
  question: "Do you feel your business could grow faster if your systems worked for you instead of against you?"
  cta: "Let's start there."
  method_title: "Email"
  method_description: "Write to us and we'll reply in less than 24 business hours."
  next_steps_title: "What happens after you contact us?"
  next_steps_subtitle: "A transparent process with no surprises. This is how we work."
  step1_title: "Initial conversation"
  step1_desc: "10-15 minutes to understand your situation. No technical jargon, no pressure."
  step2_title: "Honest evaluation"
  step2_desc: "I tell you if I can help you or not. If it's not a good fit, I'll tell you directly."
  step3_title: "Clear proposal"
  step3_desc: "If it makes sense to continue, I present a concrete plan with real deadlines and costs."
  final_cta_main: "You don't need to 'think about it more'. You need"
  final_cta_highlight: "clarity"
  final_cta_note: "You get a personalized response, zero bots, zero virtual assistants."

  steps:
  - title: "1. Diagnosis and Roadmap"
    description: "In our 'Clarity Session'..."
  - title: "2. Modernization and Implementation"
    description: "We build your centralized system..."
  - title: "3. Training and Launch"
    description: "The goal is your freedom..."

