  title: "You don't need more tools. You need a strategy."
  subtitle: "We don't sell tools → we sell solutions for your processes. We detect improvements with a 90% focus on analysis and redesign, and 10% on intelligent implementation."
  tech_perc: "10%"
  tech_title: "Technology"
  tech_desc: "The tools and automations we implement."
  strat_perc: "90%"
  strat_title: "Strategy"
  strat_desc: "The analysis, process redesign, and mindset to modernize your way of operating."

ai_section:
  title: "AI as a Strategic Accelerator"
  description: "We don't see AI as a simple add-on, but as the engine that powers an already modernized business base. We apply it with a single goal: to give you a measurable and sustainable competitive advantage."
  levels:
