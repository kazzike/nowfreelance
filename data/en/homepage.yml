hero:
  eyebrow: "DIGITAL OPERATIONS CONSULTING"
  title: "Your business should work for you. Not the other way around."
  description: "We improve processes, connect your tools and automate the work that takes up your time. Practical technology, applied to real problems."
  primary_cta: "Request a Clarity Session"
  secondary_cta: "See how we help"
  audience_note: "For independent professionals and small businesses."

audiences:
  title: "A simpler business starts with better systems."
  subtitle: "We work with professionals who need their time back and businesses that want to grow without adding complexity."
  items:
    - eyebrow: "FOR FREELANCERS"
      title: "Take control of your working day."
      description: "Reduce admin, organise your business information and connect the tools you already use."
      points:
        - "Less repetitive work and manual follow-up."
        - "Better organised clients, tasks and information."
        - "Simple processes you can maintain."
      link_text: "Let's talk about your work"
      link: "/contact/"
    - eyebrow: "FOR SMALL BUSINESSES"
      title: "Help your team work as one."
      description: "Standardise operations, remove information silos and build systems that support growth."
      points:
        - "Clear processes and responsibilities."
        - "Connected tools and centralised information."
        - "Automation where it genuinely adds value."
      link_text: "Let's talk about your business"
      link: "/contact/"

pain_points:
  title: "Where is your time going?"
  subtitle: "The symptoms are usually familiar. Our job is to find the cause and fix it at the source."
  items:
    - icon: "files"
      title: "Scattered information"
      description: "Documents and data spread across spreadsheets, email and disconnected apps."
    - icon: "repeat"
      title: "Repetitive tasks"
      description: "Copying, chasing, remembering and updating information by hand."
    - icon: "users"
      title: "Everything depends on one person"
      description: "Knowledge lives in someone's head, making delegation difficult."
    - icon: "workflow"
      title: "Disconnected tools"
      description: "Systems do not share information and teams duplicate their effort."

services:
  eyebrow: "WHAT WE DO"
  title: "Strategy first. Technology with a purpose."
  subtitle: "We do not start by recommending apps. We understand how your business works and design a solution that fits."
  items:
    - number: "01"
      title: "Process optimisation"
      description: "We analyse how you work, identify friction and design clearer, more efficient operations."
      deliverable: "A diagnosis and prioritised roadmap."
    - number: "02"
      title: "Automation and integration"
      description: "We connect tools and automate tasks to reduce manual work and errors."
      deliverable: "Workflows implemented, tested and documented."
    - number: "03"
      title: "Practical AI integration"
      description: "We introduce AI when it improves a specific process: classification, search, assistance or information handling."
      deliverable: "Useful, supervised and maintainable solutions."

solution:
  pre_title: "OUR APPROACH"
  title: "You don't need more tools. You need them to work together."
  subtitle: "First we understand the process. Then we simplify, connect and automate what makes sense. Technology should fit the business, not the other way around."
  tech_perc: "03"
  tech_title: "Principles"
  tech_desc: "Clarity, security and solutions you can maintain."
  strat_perc: "01"
  strat_title: "Priority"
  strat_desc: "Solve the operational problem before choosing the tool."

process:
  title: "From complexity to a system that works."
  subtitle: "A clear, collaborative process shaped around the way you work."
  steps:
    - title: "Understand"
      description: "We discuss your goals, how you work and where the bottlenecks appear."
    - title: "Design"
      description: "We set priorities and define a realistic solution, scope and next steps."
    - title: "Implement"
      description: "We configure, test and document the changes, helping you use them independently."

ai_section:
  title: "AI when it solves a real problem."
  description: "Artificial intelligence is not a goal in itself. We introduce it when it improves the quality, speed or capability of a process, with human oversight and clear boundaries."
  levels:
    - title: "Practical assistance"
      description: "Support for finding information, preparing content or handling repetitive tasks."
      icon: "sparkles"
    - title: "More useful information"
      description: "Classification, extraction and querying of data to reduce manual work."
      icon: "search"
    - title: "Connected processes"
      description: "AI integrated into existing workflows, with appropriate checks and safeguards."
      icon: "workflow"

contact:
  subtitle: "Tell us what is taking up your time or holding back your growth."
  question: "In an initial 20-minute Clarity Session, we'll understand your situation and see whether we can help."
  cta: "No commitment and no pre-packaged sales pitch."
  method_title: "Request by email"
  method_description: "Send us a short note and we'll arrange a Clarity Session."
  next_steps_title: "What happens next?"
  next_steps_subtitle: "A straightforward and transparent first step."
  step1_title: "Tell us about your situation"
  step1_desc: "A few lines about your work and the problem you'd like to solve."
  step2_title: "Clarity Session"
  step2_desc: "An initial conversation of around 20 minutes to understand the context."
  step3_title: "Next steps, if there's a fit"
  step3_desc: "We'll be honest about whether we can help and what would make sense."
  final_cta_main: "Start with a conversation."
  final_cta_highlight: "No commitment"
  final_cta_note: "You don't need to have the problem perfectly defined before getting in touch."
