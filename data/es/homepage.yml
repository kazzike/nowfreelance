ai_section:
  title: "IA como Acelerador Estratégico"
  description: "No vemos la IA como un simple añadido, sino como el motor que potencia una base de negocio ya modernizada. La aplicamos con un único fin: darte una ventaja competitiva medible y sostenible."
  levels:
    - title: "Eficiencia Aumentada"
      description: "Liberamos el potencial de tu equipo acelerando procesos existentes con inteligencia."
      icon: "zap"
    - title: "Inteligencia Operativa"
      description: "Extraemos insights de tus datos para que tomes decisiones más inteligentes y proactivas."
      icon: "brain-circuit"
    - title: "Ventaja Estratégica"
      description: "Creamos sistemas únicos que se convierten en un activo central y diferenciador para tu negocio."
      icon: "gem"