hero:
  title: "Escala tu negocio, no el caos."
  description: "Consultoría de Optimización de Procesos: Detectamos puntos de mejora en tus operaciones, diseñamos soluciones personalizadas y las implementamos con herramientas inteligentes (como IA cuando añade valor real). Pasa de autoempleado a líder estratégico, ahorrando hasta 20h/semana en ineficiencias y tan simple que podrás gestionarlo desde tu móvil."
  cta_text: "Agendar mi Sesión de Claridad Gratuita"
  cta_link: "/contact"

pain_points:
  title: "Si tu negocio crece, ¿por qué tú te sientes más atrapado?"
  subtitle: "Si te identificas con los siguientes sintomas, mira como nuestra consultoria identifica y resuelve los puntos de mejora:"
  items:
    - icon: "folder-open"
      title: "Información Fragmentada"
      description: "Datos dispersos en Excel, Word y otras plataformas. → Diagnosticamos conexiones fallidas y centralizamos todo en un sistema unificado."
    - icon: "user-cog"
      title: "El negocio depende 100% de ti"
      description: "Procesos no delegables. → Detectamos brechas en documentación y estandarizamos flujos para autonomía de equipo."
    - icon: "alert-triangle"
      title: "El crecimiento te da miedo"
      description: "Más clientes = más desorden. → Identificamos cuellos de botella y optimizamos procesos para escalar sin perder tiempo."
    - icon: "plane"
      title: "Vacaciones Imposibles"
      description: "Todo se detiene sin ti. → Analizamos dependencias y creamos alertas/automaciones para monitoreo remoto."
    - icon: "trending-down"
      title: "Oportunidades Perdidas"
      description: "Leads fríos o clientes insatisfechos. → Analizamos dónde se pierden las oportunidades y aplicamos estrategias para convertirlas en ventas reales"
    - icon: "git-merge"
      title: "No es falta de esfuerzo"
      description: " → es falta de diagnóstico experto. Nosotros lo detectamos y solucionamos."

process:
  title: "Tu plan de modernización en 3 pasos"
  subtitle: "No interrumpimos tu negocio. Lo potenciamos de forma fluida y sin jerga técnica."
  steps:
    - title: "1. Diagnóstico y Hoja de Ruta"
      description: "En nuestra 'Sesión de Claridad', mapeamos tu negocio, no tus apps. Entendemos tus ambiciones y detectamos los cuellos de botella que realmente frenan tu escalada. Te entregamos un plan claro."
    - title: "2. Modernización e Implementación"
      description: "Construimos tu sistema centralizado. Migramos tus viejos procesos a un ecosistema digital integrado y seguro, accesible desde cualquier dispositivo."
    - title: "3. Formación y Despegue"
      description: "El objetivo es tu libertad. Te formamos a ti y a tu equipo para que dominéis el nuevo sistema. No creamos dependencia, creamos autonomía."

case_study:
  title: "Caso de Éxito: De estar atrapado en el Excel a liderar un negocio en expansión"
  challenge_title: "El Reto"
  challenge: "Un cliente con una visión clara de expandir su negocio a nuevas regiones, pero ahogado en el caos de gestionar créditos y ventas con archivos locales de Excel y Word. El crecimiento era imposible."
  mission_title: "Nuestra Misión"
  mission: "El problema no era el Excel, era la mentalidad. El primer paso fue estratégico: demostrar que para escalar, hay que confiar en sistemas modernos."
  transformation_title: "La Transformación"
  transformation: "Creamos un ecosistema digital único que centralizó toda la operación. Todo el equipo, sin importar la ubicación, empezó a trabajar sobre la misma información en tiempo real."
  result_title: "El Resultado"
  result: "Hoy, gestiona un negocio multi-oficina desde un único lugar, ha eliminado la pérdida de datos y ha recuperado el tiempo y la paz mental para enfocarse en lo que de verdad importa: seguir creciendo."
  cta_text: "Ver cómo podemos hacer esto por ti"
  cta_link: "/contact"

contact:
  subtitle: "No hay compromiso. Solo una conversación honesta sobre si podemos ayudarte a escalar tu negocio."
  question: "¿Sientes que tu negocio podría crecer más rápido si tus sistemas trabajaran para ti en lugar de contra ti?"
  cta: "Empecemos por ahí."
  method_title: "Email"
  method_description: "Escríbenos y te respondemos en menos de 24 horas laborables."
  next_steps_title: "¿Qué pasa después de contactar?"
  next_steps_subtitle: "Un proceso transparente y sin sorpresas. Así es como trabajamos."
  step1_title: "Conversación inicial"
  step1_desc: "10-15 minutos para entender tu situación. Sin jerga técnica, sin presión."
  step2_title: "Evaluación honesta"
  step2_desc: "Te digo si puedo ayudarte o no. Si no es un buen fit, te lo digo directamente."
  step3_title: "Propuesta clara"
  step3_desc: "Si tiene sentido seguir, te presento un plan concreto con plazos y costes reales."
  final_cta_main: "No necesitas \"pensarlo más\". Necesitas"
  final_cta_highlight: "claridad"
  final_cta_note: "Obtienes respuesta personalizada, cero bots, cero asistentes virtuales."

  steps:
  - title: "1. Diagnóstico y Hoja de Ruta"
    description: "En nuestra 'Sesión de Claridad'..."
  - title: "2. Modernización e Implementación"
    description: "Construimos tu sistema centralizado..."
  - title: "3. Formación y Despegue"
    description: "El objetivo es tu libertad..."

