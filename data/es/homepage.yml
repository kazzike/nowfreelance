hero:
  eyebrow: "CONSULTORÍA DE OPERACIONES DIGITALES"
  title: "Tu negocio debería trabajar para ti. No al revés."
  description: "Optimizamos procesos, conectamos tus herramientas y automatizamos el trabajo que te quita tiempo. Tecnología útil, aplicada a problemas reales."
  primary_cta: "Solicitar una sesión de claridad"
  secondary_cta: "Descubrir cómo ayudamos"
  audience_note: "Para profesionales independientes y pequeñas empresas."

audiences:
  title: "Un negocio más sencillo de gestionar empieza por sistemas mejores."
  subtitle: "Trabajamos con profesionales que necesitan recuperar tiempo y empresas que quieren crecer sin añadir complejidad."
  items:
    - eyebrow: "PARA AUTÓNOMOS"
      title: "Recupera el control de tu día."
      description: "Reduce tareas administrativas, organiza la información de tu actividad y conecta las herramientas que ya utilizas."
      points:
        - "Menos trabajo repetitivo y seguimiento manual."
        - "Clientes, tareas e información mejor organizados."
        - "Procesos sencillos que puedes mantener."
      link_text: "Hablemos de tu actividad"
      link: "/contact/"
    - eyebrow: "PARA PEQUEÑAS EMPRESAS"
      title: "Haz que el equipo trabaje de forma coordinada."
      description: "Estandariza operaciones, elimina silos de información y crea sistemas que acompañen el crecimiento."
      points:
        - "Procesos claros y responsabilidades definidas."
        - "Herramientas conectadas y datos centralizados."
        - "Automatización donde realmente aporta valor."
      link_text: "Hablemos de tu empresa"
      link: "/contact/"

pain_points:
  title: "¿Dónde se está escapando tu tiempo?"
  subtitle: "Los síntomas suelen ser cotidianos. El trabajo consiste en encontrar la causa y resolverla de raíz."
  items:
    - icon: "files"
      title: "Información dispersa"
      description: "Documentos y datos repartidos entre hojas de cálculo, correos y aplicaciones."
    - icon: "repeat"
      title: "Tareas repetitivas"
      description: "Copiar, perseguir, recordar y actualizar información manualmente."
    - icon: "users"
      title: "Todo depende de una persona"
      description: "El conocimiento está en la cabeza de alguien y delegar resulta difícil."
    - icon: "workflow"
      title: "Herramientas desconectadas"
      description: "Los sistemas no comparten información y el equipo duplica esfuerzos."

services:
  eyebrow: "QUÉ HACEMOS"
  title: "Estrategia primero. Tecnología con propósito."
  subtitle: "No empezamos recomendando aplicaciones. Entendemos cómo funciona tu negocio y diseñamos una solución proporcionada a tus necesidades."
  items:
    - number: "01"
      title: "Optimización de procesos"
      description: "Analizamos cómo trabajas, detectamos fricciones y diseñamos una forma de operar más clara y eficiente."
      deliverable: "Diagnóstico y hoja de ruta priorizada."
    - number: "02"
      title: "Automatización e integración"
      description: "Conectamos herramientas y automatizamos tareas para reducir trabajo manual y errores."
      deliverable: "Flujos implementados, probados y documentados."
    - number: "03"
      title: "Integración práctica de IA"
      description: "Incorporamos IA cuando mejora un proceso concreto: clasificación, búsqueda, asistencia o tratamiento de información."
      deliverable: "Soluciones útiles, supervisables y mantenibles."

solution:
  pre_title: "NUESTRO ENFOQUE"
  title: "No necesitas más herramientas. Necesitas que trabajen juntas."
  subtitle: "Primero entendemos el proceso. Después simplificamos, conectamos y automatizamos solo lo que tiene sentido. La tecnología debe adaptarse al negocio, no al contrario."
  tech_perc: "03"
  tech_title: "Principios"
  tech_desc: "Claridad, seguridad y soluciones que puedas mantener."
  strat_perc: "01"
  strat_title: "Prioridad"
  strat_desc: "Resolver el problema operativo antes de elegir la herramienta."

process:
  title: "De la complejidad a un sistema que funciona."
  subtitle: "Un proceso claro, colaborativo y adaptado al ritmo de tu actividad."
  steps:
    - title: "Entender"
      description: "Conversamos sobre tus objetivos, cómo trabajas y dónde aparecen los bloqueos."
    - title: "Diseñar"
      description: "Definimos prioridades y una solución realista, con alcance y próximos pasos claros."
    - title: "Implementar"
      description: "Configuramos, probamos y documentamos los cambios. Te acompañamos para que puedas utilizarlos con autonomía."

ai_section:
  title: "IA cuando resuelve un problema real."
  description: "La inteligencia artificial no es un objetivo por sí mismo. La incorporamos cuando mejora la calidad, la velocidad o la capacidad de un proceso, con supervisión humana y criterios claros."
  levels:
    - title: "Asistencia práctica"
      description: "Ayuda para consultar información, preparar contenidos o gestionar tareas repetitivas."
      icon: "sparkles"
    - title: "Información más útil"
      description: "Clasificación, extracción y consulta de datos para reducir trabajo manual."
      icon: "search"
    - title: "Procesos conectados"
      description: "IA integrada en flujos existentes, con límites y validaciones adecuados."
      icon: "workflow"

contact:
  subtitle: "Cuéntanos qué te está quitando tiempo o frenando el crecimiento."
  question: "En una primera conversación de claridad de unos 20 minutos entenderemos tu situación y veremos si podemos ayudarte."
  cta: "Sin compromiso y sin presentación comercial prefabricada."
  method_title: "Solicitar por email"
  method_description: "Escríbenos brevemente y coordinaremos una sesión de claridad."
  next_steps_title: "¿Qué ocurre después?"
  next_steps_subtitle: "Un primer contacto sencillo y transparente."
  step1_title: "Nos cuentas tu situación"
  step1_desc: "Unas líneas sobre tu actividad y el problema que quieres resolver."
  step2_title: "Sesión de claridad"
  step2_desc: "Una conversación inicial de aproximadamente 20 minutos para entender el contexto."
  step3_title: "Siguiente paso, si encaja"
  step3_desc: "Te explicamos honestamente si podemos ayudarte y qué tendría sentido hacer."
  final_cta_main: "Empieza por una conversación."
  final_cta_highlight: "Sin compromiso"
  final_cta_note: "No necesitas tener el problema perfectamente definido para escribirnos."
