<div class="nav-bar" id="top">

    <button class="nav-toggle" type="button" aria-label="{{ if eq site.Language.Lang "en" }}Open menu{{ else }}Abrir menú{{ end }}" aria-controls="header-nav" aria-expanded="false">
      <span class="hamburger-line"></span><span class="hamburger-line"></span><span class="hamburger-line"></span>
    </button>
    <nav class="header-nav" id="header-nav" aria-label="{{ if eq site.Language.Lang "en" }}Main navigation{{ else }}Navegación principal{{ end }}">
      <ul class="nav-links">
        {{ range .Site.Menus.main }}
          <li><a href="{{ .URL | relLangURL }}">{{ .Name }}</a></li>
        {{ end }}
        <li class="lang-switcher">
          <a href="/" lang="es" hreflang="es" aria-label="Español">ES</a>
          <span aria-hidden="true">/</span>
          <a href="/en/" lang="en" hreflang="en" aria-label="English">EN</a>
        </li>
      </ul>
    </nav>
  </div>
