<section class="nf-section nf-process">
  <div class="nf-container">
    <div class="nf-section-heading">
      <p class="nf-eyebrow">{{ if eq site.Language.Lang "en" }}HOW WE WORK{{ else }}CÓMO TRABAJAMOS{{ end }}</p>
      <h2>{{ .title }}</h2>
      <p>{{ .subtitle }}</p>
    </div>
    <div class="nf-process-grid">
      {{ range $index, $step := .steps }}
      <article class="nf-process-step">
        <span class="nf-step-number">0{{ add $index 1 }}</span>
        <h3>{{ $step.title }}</h3>
        <p>{{ $step.description }}</p>
      </article>
      {{ end }}
    </div>
  </div>
</section>
