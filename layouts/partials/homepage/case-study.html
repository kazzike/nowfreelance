<section class="spaciado-xl success-story">
  <div class="mw8 center ph3">
    <div class="success-story-header">
      <h2 class="success-story-title">{{ .title }}</h2>
    </div>
    
    <div class="success-story-content">
      <div class="story-section">
        <h3 class="story-section-title">{{ .challenge_title }}</h3>
        <p class="story-section-text">{{ .challenge }}</p>
      </div>

      <div class="story-section">
        <h3 class="story-section-title">{{ .mission_title }}</h3>
        <p class="story-section-text">{{ .mission }}</p>
      </div>

      <div class="story-section">
        <h3 class="story-section-title">{{ .transformation_title }}</h3>
        <p class="story-section-text">{{ .transformation }}</p>
      </div>

      <div class="story-section story-result">
        <h3 class="story-section-title">{{ .result_title }}</h3>
        <p class="story-section-text">{{ .result }}</p>
      </div>

      <div class="story-cta">
        <a href="/contact" class="story-cta-button">Ver cómo podemos hacer esto por ti</a>
      </div>
    </div>
  </div>
</section>
