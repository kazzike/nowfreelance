<section class="nf-section nf-ai">
  <div class="nf-container nf-ai-inner">
    <div>
      <p class="nf-eyebrow">{{ if eq site.Language.Lang "en" }}ARTIFICIAL INTELLIGENCE{{ else }}INTELIGENCIA ARTIFICIAL{{ end }}</p>
      <h2>{{ .title }}</h2>
      <p>{{ .description }}</p>
    </div>
    <div class="nf-ai-list">
      {{ range .levels }}
      <article><span aria-hidden="true">+</span><div><h3>{{ .title }}</h3><p>{{ .description }}</p></div></article>
      {{ end }}
    </div>
  </div>
</section>
