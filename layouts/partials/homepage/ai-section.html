<section class="ai-unified-section">
  <div class="mw8 center ph3">

    <div class="ai-unified-card">
      <div class="ai-unified-grid">

        <div class="ai-unified-intro">
          <div class="ai-intro-icon">
            <i data-lucide="bot"></i>
          </div>
          <h2 class="ai-intro-title">{{ .title }}</h2>
          <p class="ai-intro-description">{{ .description }}</p>
        </div>

        <div class="ai-unified-levels">
          <ul>
            {{ range .levels }}
            <li>
              <div class="level-icon"><i data-lucide="{{ .icon }}"></i></div>
              <div class="level-content">
                <h4 class="level-title">{{ .title }}</h4>
                <p class="level-description">{{ .description }}</p>
              </div>
            </li>
            {{ end }}
          </ul>
        </div>

      </div>
    </div>
    
  </div>
</section>
