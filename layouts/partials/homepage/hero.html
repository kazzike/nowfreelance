<section class="nf-hero">
  <div class="nf-container nf-hero-inner">
    <p class="nf-eyebrow">{{ .eyebrow }}</p>
    <h1>{{ .title }}</h1>
    <p class="nf-hero-copy">{{ .description }}</p>
    <div class="nf-actions">
      <a class="nf-button nf-button-primary" href="{{ "contact/" | relLangURL }}">{{ .primary_cta }}</a>
      <a class="nf-text-link" href="#services">{{ .secondary_cta }} <span aria-hidden="true">→</span></a>
    </div>
    <p class="nf-hero-note">{{ .audience_note }}</p>
  </div>
</section>
