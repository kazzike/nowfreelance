<section class="nf-section nf-pain-points">
  <div class="nf-container">
    <div class="nf-section-heading">
      <p class="nf-eyebrow">{{ if eq site.Language.Lang "en" }}COMMON CHALLENGES{{ else }}PROBLEMAS HABITUALES{{ end }}</p>
      <h2>{{ .title }}</h2>
      <p>{{ .subtitle }}</p>
    </div>
    <div class="nf-pain-grid">
      {{ range .items }}
      <article class="nf-pain-item">
        <span class="nf-pain-mark" aria-hidden="true">↗</span>
        <h3>{{ .title }}</h3>
        <p>{{ .description }}</p>
      </article>
      {{ end }}
    </div>
  </div>
</section>
